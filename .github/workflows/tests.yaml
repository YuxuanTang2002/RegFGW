name: core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@v7
      - name: set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: run tests
        run: python -m pytest
